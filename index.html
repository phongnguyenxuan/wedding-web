<div id="app">

    <canvas id="game" width="480" height="270"></canvas>

    <div id="memory"><div class="ph" id="memPhoto"><span>Ảnh kỷ niệm<br>(thay bằng ảnh thật)</span></div><div class="cap" id="memCap"></div></div>
    <div id="banner" hidden><div class="n" id="bnN"></div><div class="t" id="bnT"></div><div class="h" id="bnH"></div></div>
    <div id="dialog" hidden role="dialog" aria-live="polite"><div class="who" id="dlgWho"></div><div class="txt" id="dlgTxt"></div><span class="more">▼</span></div>
  </div>
</div>
<div id="modal"></div>
<noscript><p style="text-align:center;padding:2em">Vui lòng bật JavaScript để xem thiệp cưới.</p></noscript>
