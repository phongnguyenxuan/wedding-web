<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Phong &amp; Trang – Thiệp cưới 32-bit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3dccb; --ink:#3a1d2e; --panel:#fff3d6; --red:#d7263d; --gold:#f2b134;
  --pink:#ff7aa2; --muted:#7a5a66; --shade:rgba(43,22,51,.78);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){ --bg:#1d0f24; --muted:#c2a3b1; }
}
:root[data-theme="dark"]{ --bg:#1d0f24; --muted:#c2a3b1; }
*,*::before,*::after{ box-sizing:inherit; }
html{ height:100%; scroll-padding-top:env(safe-area-inset-top,0px); }
body{
  margin:0; height:100%; background:var(--bg); color:var(--ink);
  font-family:"VT323", ui-monospace, "Courier New", monospace; font-size:20px; line-height:1.15;
  overflow:hidden; -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent;
}
#app{ height:100%; display:flex; align-items:center; justify-content:center; }
#stage{ position:relative; overflow:hidden; background:#000; box-shadow:0 0 0 4px var(--ink); }
#game{ display:block; width:100%; height:100%; image-rendering:pixelated; image-rendering:crisp-edges; }

#hud{ position:absolute; top:0; left:0; right:0; display:flex; align-items:center; justify-content:space-between;
  gap:.5em; padding:.35em .6em; color:#fff; text-shadow:2px 2px 0 #1b1b2f; pointer-events:none; font-size:1.1em; }
#hud .hearts{ color:#ffe066; min-width:4em; }
#hud .hearts b{ color:#ff6b8b; font-weight:400; }
#hud .lvl{ text-align:left; flex:1; }
.hbtn{ display:flex; gap:.35em; }
.hbtn button{ pointer-events:auto; font:inherit; font-size:.85em; color:#fff; background:rgba(255,255,255,.14); border:0; padding:.05em .45em; cursor:pointer; text-shadow:inherit; }
.hbtn button[aria-pressed="true"]{ background:rgba(242,177,52,.55); }
#hud{ padding-top:.1em !important; }
#dialog.side{ right:50%; }
#dialog.narr .txt{ color:var(--muted); font-style:italic; }


#banner{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
  color:#fff; text-shadow:3px 3px 0 #1b1b2f; background:rgba(27,27,47,.45); text-align:center; padding:1em; }
#banner .n{ font-size:1.2em; color:#ffe066; }
#banner .t{ font-size:2.4em; line-height:1; margin:.1em 0 .3em; }
#banner .h{ font-size:1em; opacity:.95; }
#banner.withmap{ padding-left:34%; background:transparent; }

#dialog{ position:absolute; left:3%; right:3%; top:10%; background:var(--panel); color:var(--ink);
  border:3px solid var(--ink); box-shadow:0 0 0 3px var(--panel), 6px 6px 0 3px rgba(27,27,47,.5);
  padding:.45em .7em .5em; cursor:pointer; font-size:1.15em; }
#dialog .who{ color:var(--red); font-size:1em; }
#dialog .who:empty{ display:none; }
#dialog .txt{ min-height:2.3em; }
#dialog .more{ position:absolute; right:.5em; bottom:.25em; color:var(--red); animation:blink 1s steps(2) infinite; }
@keyframes blink{ 50%{ opacity:0; } }

#tip{ position:absolute; left:50%; bottom:12%; transform:translateX(-50%); background:rgba(27,27,47,.8); color:#ffe066;
  padding:.2em .7em; white-space:nowrap; font-size:1em; transition:opacity .4s; opacity:0; pointer-events:none; }
#tip.on{ opacity:1; }

#memory{ position:absolute; right:3%; top:12%; width:27%; background:#fff; padding:.35em .35em .2em; color:var(--ink);
  transform:rotate(3deg); box-shadow:4px 4px 0 rgba(27,27,47,.45); transition:opacity .5s, transform .5s; opacity:0; pointer-events:none; }
#memory.on{ opacity:1; transform:rotate(-2deg); }
#memory .ph{ aspect-ratio:4/3; background:repeating-linear-gradient(45deg,#ffd6e0 0 6px,#ffe8ee 6px 12px);
  display:flex; align-items:center; justify-content:center; text-align:center; color:var(--red); font-size:.8em; padding:.3em; }
#memory .cap{ font-size:.8em; text-align:center; padding-top:.2em; }

#modal{ position:fixed; inset:0; background:var(--shade); display:flex; overflow:auto; z-index:20;
  padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px)); }
#modal[hidden], #dialog[hidden], #banner[hidden], #pad[hidden]{ display:none; }
.panel{ margin:auto; width:100%; max-width:440px; background:var(--panel); color:var(--ink); border:4px solid var(--ink);
  box-shadow:0 0 0 4px var(--panel), 10px 10px 0 4px rgba(0,0,0,.35); padding:20px 22px 22px; -webkit-user-select:text; user-select:text; }
.panel h1{ font-weight:400; font-size:52px; line-height:.9; margin:0; color:var(--red); text-align:center; }
.panel h2{ font-weight:400; font-size:30px; margin:0 0 8px; line-height:1; }
.panel p{ margin:6px 0 14px; font-size:21px; }
.sub{ text-align:center; color:var(--muted); margin-top:4px !important; }
.field{ margin:14px 0 0; }
.field > span{ display:block; font-size:21px; margin-bottom:6px; }
.row{ display:flex; gap:10px; }
.choice{ flex:1; font:inherit; font-size:22px; color:var(--ink); background:#fff; border:3px solid var(--ink); padding:6px 8px;
  cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px; }
.choice[aria-pressed="true"]{ background:var(--gold); box-shadow:inset 0 -4px 0 rgba(0,0,0,.18); }
.choice canvas{ width:33px; height:51px; image-rendering:pixelated; }
input[type=text]{ width:100%; font:inherit; font-size:24px; padding:6px 10px; border:3px solid var(--ink); background:#fff; color:var(--ink);
  -webkit-user-select:text; user-select:text; border-radius:0; }
.btn{ font:inherit; font-size:26px; line-height:1; color:#fff; background:var(--red); border:0; padding:10px 18px 12px; cursor:pointer;
  box-shadow:inset -4px -4px 0 rgba(0,0,0,.25), 0 0 0 3px var(--ink); }
.btn.alt{ background:#fff; color:var(--ink); }
.btn.wide{ width:100%; }
.btn:disabled{ opacity:.6; cursor:progress; }
.link{ font:inherit; font-size:20px; background:none; border:0; color:var(--muted); text-decoration:underline; cursor:pointer; padding:4px; }
button:focus-visible, input:focus-visible{ outline:3px dashed var(--red); outline-offset:4px; }
.err{ color:var(--red); min-height:1.2em; margin:6px 0 0 !important; font-size:20px !important; }
.actions{ display:flex; flex-direction:column; gap:14px; margin-top:18px; align-items:center; }
#cardView{ display:block; margin:6px auto 0; width:min(100%,320px); aspect-ratio:320/400; image-rendering:pixelated; background:#fff3d6; }
.status{ text-align:center; min-height:1.2em; color:var(--muted); font-size:19px; margin:10px 0 0 !important; }

@media (prefers-reduced-motion:reduce){ #dialog .more{ animation:none; } #memory, #tip{ transition:none; } }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="game" width="480" height="270"></canvas>
    <div id="hud"><span class="lvl" id="lvlName"></span><span class="hbtn"><button id="mute" type="button">Âm: bật</button><button id="toCard" type="button">Xem thiệp</button></span></div>
    <div id="tip"></div>
    <div id="memory"><div class="ph">Ảnh kỷ niệm<br>(thay bằng ảnh thật)</div><div class="cap" id="memCap"></div></div>
    <div id="banner" hidden><div class="n" id="bnN"></div><div class="t" id="bnT"></div><div class="h" id="bnH"></div></div>
    <div id="dialog" hidden role="dialog" aria-live="polite"><div class="who" id="dlgWho"></div><div class="txt" id="dlgTxt"></div><span class="more">▼</span></div>
  </div>
</div>
<div id="modal"></div>

<script>
/* ================== CẤU HÌNH – sửa phần này cho đám cưới của bạn ================== */
const CONFIG = {
  groom: 'Phong',
  bride: 'Trang',
  wedding: {
    groom: { label: 'nhà trai', time: '10:00, Chủ nhật 20/12/2026', address: 'Số 12 ngõ 45 phố Hoa Sữa, phường Láng, Hà Nội' },
    bride: { label: 'nhà gái',  time: '09:00, Thứ bảy 19/12/2026',  address: 'Thôn Đông, xã Yên Thường, huyện Gia Lâm, Hà Nội' }
  },
  memories: ['Bún riêu Hàng Mã, quán quen của hai đứa', 'Nam Định, nhà thờ đổ bên biển', 'Hòa Bình, sáng mây ngang nhà sàn', 'Đà Nẵng, đêm rồng phun lửa', 'Hội An, chiếc hoa đăng đầu tiên', 'Đà Lạt, ly sữa đậu nành nóng', 'Quy Nhơn, tấm ảnh đẹp nhất', 'Phú Quốc, ngày em nói đồng ý']
};

/* ================== HẰNG SỐ & BIẾN ================== */
const W = 480, H = 270, GY = 222, GRAV = 1350;
const cv = document.getElementById('game'), ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;
const $ = id => document.getElementById(id);
const stage = $('stage'), app = $('app'), modal = $('modal');
let guest = { gender: 'm', name: '', side: 'bride' };
let time = 0, cam = 0, mode = 'idle', L = null;
let particles = [], rain = [];

/* ================== SPRITES (32-bit: 20x32, đổ bóng 3 tông) ================== */
const OUT = '#2a1a2e';
function sprC(rows, colors) {
  const h = rows.length, w = Math.max(...rows.map(r => r.length));
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d');
  rows.forEach((row, j) => { for (let i = 0; i < row.length; i++) { const ch = row[i]; if (ch === '.' || !colors[ch]) continue; x.fillStyle = colors[ch]; x.fillRect(i, j, 1, 1); } });
  return c;
}
function outline(src, col = OUT) {
  const w = src.width, h = src.height, c = document.createElement('canvas'); c.width = w + 2; c.height = h + 2;
  const x = c.getContext('2d'), d = src.getContext('2d').getImageData(0, 0, w, h).data;
  const op = (i, j) => i >= 0 && j >= 0 && i < w && j < h && d[(j * w + i) * 4 + 3] > 0;
  x.fillStyle = col;
  for (let j = -1; j <= h; j++) for (let i = -1; i <= w; i++) if (!op(i, j) && (op(i-1,j)||op(i+1,j)||op(i,j-1)||op(i,j+1))) x.fillRect(i + 1, j + 1, 1, 1);
  x.drawImage(src, 1, 1); return c;
}
const flipCache = new Map();
function flipped(c) {
  if (flipCache.has(c)) return flipCache.get(c);
  const f = document.createElement('canvas'); f.width = c.width; f.height = c.height;
  const x = f.getContext('2d'); x.scale(-1, 1); x.drawImage(c, -c.width, 0); flipCache.set(c, f); return f;
}
const BLANK = '....................';
const HEAD = ['......222222211.....','....2222222222211...','...322222222222221..','..32222222222222221.','..32222222bb2222222.','..3222223bbbbbb222..','..322223abbbb33b22..','..32223cabbbwebbb...','..32223cabbbeebbb...','..3223.cbbbbbbbub...','...33..cbbbbbbmb....','........cbbbbbbb....','.........ccbbbb.....','..........cbb.......'];
const TORSO = ['.......VUUUUTT......','.....VVUUUUUUTTT....','....VVUUUUUUUUTTT...','....cVUUUUUUUUUTTa..','...ccVUUUUUUUUUTab..','...cc.VUUUUUUUUTbb..','......VVVVVVVVVV....'];
const LEGS = {
  idle: ['......ZYYYYYYYX.....','......ZYYX.ZYYX.....','......ZYYX.ZYYX.....','......ZYYX.ZYYX.....','......ZYYX.ZYYX.....','......ZYYX.ZYYX.....','......ZYYX.ZYYX.....','.....QSSS..QSSSS....','.....QQQQ..QQQQQ....'],
  run1: ['......ZYYYYYYYX.....','.....ZYYX..ZYYX.....','....ZYYX....ZYYX....','...ZYYX......ZYYX...','..ZYYX........ZYX...','.QSSX.........ZYX...','.QQQ.........QSSSS..','.............QQQQQ..',BLANK],
  run2: ['......ZYYYYYYYX.....','......ZYYYYYYX......','.......ZYYYYX.......','.......ZYYZYX.......','........ZYYYX.......','........ZYYXQSS.....','........ZYYXQQ......','.......QSSSS........','.......QQQQQ........'],
  run3: ['......ZYYYYYYYX.....','.....ZYYX..ZYYX.....','.....ZYYX...ZYYX....','....ZYYX.....ZYYX...','....ZYX.......ZYYX..','...QSSX.......ZYYX..','...QQQ.......QSSSSS.','.............QQQQQQ.',BLANK],
  jump: ['......ZYYYYYYYX.....','.....ZYYX..ZYYYX....','....ZYYX...ZYYX.....','...ZYYX....ZYX......','..QSSX....ZYYX......','..QQQ.....QSSSS.....','..........QQQQQ.....',BLANK,BLANK]
};
const KNEEL = ['......ZYYYYYYYYYX...','......ZYYYYYYYYYYX..','......ZYYYQSS..ZYX..','.....QQQQQQQ..QSSS..'];
const SIT = ['....ZYYYYYYYYYYYYX..','...ZYYYYYYYYYYYYYYX.','...QQQSS.....QSSQQ..'];
const BRIDE = ['......222222211R....','....2222222222211RR.','...322222222222221..','..32222222222222221.','..32222222bb2222222.','..3222223bbbbbb222..','..322223abbbb33b22..','.322223cabbbwebbb...','.322223cabbbeebbb...','.32223.cbbbbbbbub...','.32223.cbbbbbbmb....','.3223...cbbbbbbb....','.3223....ccbbbb.....','.3223.....cbb.......','.3223..VUUUUTT......','.323.VVUUUUUUTTT....','..3.VVUUUUUUUUTTa...','...cVUUUUUUUUUTTbb..','...cVUUUUUUUUUUTb...','....VVUUUUUUUUUT....','....VUUUUUUUUUUUT...','...VUUUUUUUUUUUUTT..','...VUUUUUUUUUUUUUT..','..VVUUUUUUUUUUUUUTT.','..VVVVVVVVVVVVVVVVV.'];
const BLEGS = {
  idle: ['.......cb...cb......','.......cb...cb......','......QSS..QSSS.....','......QQQ..QQQQ.....'],
  walk1: ['......cb.....cb.....','.....cb.......cb....','....QSS.......QSSS..','....QQQ.......QQQQ..'],
  walk2: ['........cbcb........','........cbcb........','.......QSSSSS.......','.......QQQQQQ.......'],
  jump: ['.......cb....cb.....','......QSS.....cb....','......QQQ.....QSS...','..............QQQ...']
};
const SKIN = { a:'#ffe0c2', b:'#f5c29a', c:'#d99a72', e:'#1b1b2f', m:'#b5534a', w:'#ffffff', M:'#6e2230' };
const LOOK = {
  groom:    { ...SKIN, u:'#f5c29a', 1:'#4a4a6a', 2:'#2b2b42', 3:'#17172a', T:'#ffffff', U:'#e3e8f4', V:'#aab3cf', X:'#6f8cff', Y:'#3b5bdb', Z:'#263a94', S:'#f1f3f5', Q:'#9aa3ad' },
  groomWed: { ...SKIN, u:'#f5c29a', 1:'#4a4a6a', 2:'#2b2b42', 3:'#17172a', T:'#5d6270', U:'#3a3f4a', V:'#22252d', X:'#4a4f5a', Y:'#30343d', Z:'#1c1f25', S:'#3a3f4a', Q:'#16181d' },
  guestM:   { ...SKIN, u:'#f5c29a', 1:'#9a6a48', 2:'#6b4226', 3:'#472b18', T:'#7ee08d', U:'#40c057', V:'#2b8a3e', X:'#86a8ea', Y:'#4c6ef5', Z:'#3246b0', S:'#ff8787', Q:'#c92a2a' },
  father:   { ...SKIN, u:'#f5c29a', m:'#8a8f96', 1:'#f1f3f5', 2:'#ced4da', 3:'#868e96', T:'#c9925f', U:'#8d5a2b', V:'#5e3a1a', X:'#7b828a', Y:'#495057', Z:'#343a40', S:'#343a40', Q:'#1b1b2f' },
  bride:    { ...SKIN, u:'#ff9e9e', 1:'#5a4658', 2:'#2b1f2b', 3:'#170f17', R:'#ff6b8b', T:'#fff3a3', U:'#ffd43b', V:'#d9a200', S:'#ffffff', Q:'#c5ccd4' },
  brideWed: { ...SKIN, u:'#ff9e9e', 1:'#5a4658', 2:'#2b1f2b', 3:'#170f17', R:'#ffffff', T:'#ffffff', U:'#eef0f4', V:'#c3c9d4', S:'#ffffff', Q:'#c5ccd4' },
  guestF:   { ...SKIN, u:'#ff9e9e', 1:'#b06a45', 2:'#7a3e22', 3:'#4e2512', R:'#ffd43b', T:'#ffd6e7', U:'#ff8fb8', V:'#d6457a', S:'#ffffff', Q:'#c5ccd4' }
};
const IP = { k:'#1b1b2f', r:'#e8364f', d:'#a61e3a', p:'#ff9eb0', w:'#ffffff', y:'#ffd43b', Y:'#d99e00', o:'#f08c00', n:'#b07a4f', N:'#6b4226',
  g:'#51cf66', G:'#2b8a3e', s:'#dee2e6', S:'#9aa3ad', K:'#495057', b:'#339af0', B:'#1864ab', c:'#fff3d6', t:'#e7d3b5', l:'#a5d8ff' };
const S = {};
function char(rows, look, post) { const c = sprC(rows, LOOK[look]); if (post) post(c.getContext('2d')); return outline(c); }
function suit(x) { x.fillStyle = '#ffffff'; x.fillRect(11, 16, 2, 1); x.fillRect(11, 17, 3, 1); x.fillStyle = '#e03131'; x.fillRect(12, 17, 1, 4); x.fillStyle = '#a61e3a'; x.fillRect(12, 20, 1, 1); }
function veil(x) { x.fillStyle = '#f8f9fa'; x.fillRect(0, 6, 2, 20); x.fillRect(2, 4, 1, 12); x.fillStyle = '#dde1e7'; x.fillRect(0, 22, 2, 5); x.fillRect(0, 10, 1, 3); }
const setC = (r, i, ch) => r.slice(0, i) + ch + r.slice(i + 1);
const shiftRow = (r, d) => d > 0 ? '.' + r.slice(0, -1) : r.slice(1) + '.';
function faceRows(rows, v) { rows = rows.slice(); if (v === 'b') { rows[7] = setC(setC(rows[7], 12, 'b'), 13, 'b'); } if (v === 't') { rows[10] = setC(rows[10], 13, 'm'); rows[11] = setC(setC(rows[11], 13, 'M'), 14, 'M'); } return rows; }
function brideRows(v, legKey) { const r = faceRows(BRIDE, v); const d = legKey === 'walk1' ? 1 : legKey === 'walk2' ? -1 : 0; if (d) for (let i = 22; i < 25; i++) r[i] = shiftRow(r[i], d); return r; }
function buildVariants() {
  S.V = {};
  for (const v of ['n', 'b', 't']) {
    for (const k in LEGS) S.V[`groom|${k}|${v}`] = char([BLANK, BLANK].concat(faceRows(HEAD, v), TORSO, LEGS[k]), 'groom');
    S.V[`groom|kneel|${v}`] = char(Array(7).fill(BLANK).concat(faceRows(HEAD, v), TORSO, KNEEL), 'groom');
    for (const k in BLEGS) S.V[`bride|${k}|${v}`] = char([BLANK, BLANK, BLANK].concat(brideRows(v, k), BLEGS[k]), 'bride');
    S.V[`guestM|idle|${v}`] = char([BLANK, BLANK].concat(faceRows(HEAD, v), TORSO, LEGS.idle), 'guestM');
    S.V[`guestF|idle|${v}`] = char([BLANK, BLANK, BLANK].concat(faceRows(BRIDE, v), BLEGS.idle), 'guestF');
    S.V[`father|sit|${v}`] = char(faceRows(HEAD, v).concat(TORSO, SIT), 'father');
  }
}
function buildSprites() {
  const top = [BLANK, BLANK].concat(HEAD, TORSO);
  S.groom = {}; for (const k in LEGS) S.groom[k] = char(top.concat(LEGS[k]), 'groom');
  S.groomWed = char(top.concat(LEGS.idle), 'groomWed', suit);
  S.kneel = char(Array(7).fill(BLANK).concat(HEAD, TORSO, KNEEL), 'groom');
  S.guestM = char(top.concat(LEGS.idle), 'guestM');
  S.father = char(HEAD.concat(TORSO, SIT), 'father');
  const btop = [BLANK, BLANK, BLANK].concat(BRIDE);
  S.bride = {}; for (const k in BLEGS) S.bride[k] = char(btop.concat(BLEGS[k]), 'bride');
  S.brideWed = char(btop.concat(BLEGS.idle), 'brideWed', veil);
  S.guestF = char(btop.concat(BLEGS.idle), 'guestF');
  const it = rows => outline(sprC(rows, IP));
  S.heart = it(['.rrr...rrr.','rpwrr.rrrrr','rwprrrrrrrd','rprrrrrrrrd','rrrrrrrrrrd','.rrrrrrrrd.','..rrrrrrd..','...rrrrd...','....rrd....','.....d.....']);
  S.coffee = it(['......kk....','.....kk.....','.swwwwwwwws.','sswwwwwwwwss','.tnnnnnnnnt.','.tnNNnnnnnt.','.tncccccNnt.','.tnnnnnnnnt.','..nNnnnnnn..','..nnnnnnNn..','..nnnnnnnn..','...nnnnnn...']);
  S.flower = it(['...pp..rr.....','..pwpprrdr.pp.','..pppprrrrpwpp','.rr.pp.rrdpppp','rwrrggrrg..pp.','rrrdgGgggrr...','.rdgGggGgrwr..','...gGggGg.rrd.','....GggG......','.....yyy......','....yYyyY.....','.....yYy......','......gG......','......gG......','......gG......','.......G......']);
  S.umbrella = it(['........k.........','.....rrrrrrrr.....','...rrpwrrrrrrrr...','..rpwrrrrrrrrrrd..','.rprrrrrrrrrrrrrd.','rrrrrrrrrrrrrrrrdd','d.d..d..k..d..d..d','........k.........','........k.........','........k.........','........k.........','......k.k.........','.......k..........']);

    else { dlgT += dt; if (dlgT > Math.min(2.0, Math.max(1.0, dlg.full.length * .028))) { dlgT = 0; advance(); } } }
  if (fireworks > 0) { fireworks -= dt; fwNext -= dt; if (fwNext <= 0) { fwNext = .3 + Math.random() * .3;
    const cols = [['#ffd43b', '#fff3bf', '#ffa94d'], ['#ff6b8b', '#ffffff', '#ffc2d1'], ['#74c0fc', '#ffffff', '#d0ebff'], ['#b197fc', '#ffd43b', '#ffffff']][Math.floor(Math.random() * 4)];
    burst(cam + 60 + Math.random() * 360, 30 + Math.random() * 90, cols, 40, 110, 1.3, 45); sfx('boom'); } }
  if (fadeDir) { fadeA += fadeDir * dt * 3; if (fadeDir > 0 && fadeA >= 1) { fadeA = 1; fadeDir = -1; const c = fadeCb; fadeCb = null; c && c(); } if (fadeDir < 0 && fadeA <= 0) { fadeA = 0; fadeDir = 0; } }
}

/* ================== VÒNG LẶP ================== */
let last = 0, acc = 0;
function loop(t) {
  const dt = Math.min(.1, (t - last) / 1000 || 0); last = t; acc += dt;
  while (acc >= 1 / 60) { step(1 / 60); acc -= 1 / 60; }
  render(); requestAnimationFrame(loop);
}
function step(dt) {
  time += dt; sceneT += dt; updateActors(dt); updateStory(dt); tripUpdate(dt); if (mapAnim) mapAnim.t += dt;
  updateFx(dt);
}
function render() {
  if (mode === 'scene') { drawBg(L.theme); drawGround(L.theme); drawHanoiStall(); drawActors(); drawParticles(); if (weather.rain) drawRain(); drawPhone(); tripOverlay(); if (L.theme === 'phuquoc') { ctx.globalAlpha = .08; fr('#ff8a3d', 0, 0, W, H); ctx.globalAlpha = 1; } }
  else { L = L || { solids: [], plats: [] }; cam = time * 20 % 2000; drawBg('sunset'); fr('#3e2750', 0, GY, W, H - GY); fr('#e8779c', 0, GY, W, 5); }
  fr('#000000', 0, 0, W, 16); fr('#000000', 0, H - 14, W, 14);
  if (fadeA > 0) { ctx.globalAlpha = Math.min(1, fadeA); fr('#000000', 0, 0, W, H); ctx.globalAlpha = 1; }
}

/* ================== THIỆP & GIF ================== */
const txtCache = new Map();
function pixText(str, size, color) {

  const m = document.createElement('canvas').getContext('2d'); m.font = font;

  x.putImageData(id, 0, 0); txtCache.set(key, c); return c;
}
function fitText(str, maxW, size, color, min = 14) { let c = pixText(str, size, color); while (c.width > maxW && size > min) { size -= 2; c = pixText(str, size, color); } return c; }
function wrapText(str, maxW, size, color) {
  const words = str.split(' '), lines = []; let cur = '';
  for (const w of words) { const t = cur ? cur + ' ' + w : w; if (pixText(t, size, color).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t; }
  if (cur) lines.push(cur); return lines.map(l => pixText(l, size, color));
}
function center(c, img, y) { c.drawImage(img, Math.round((CW - img.width) / 2), Math.round(y)); }
const CW = 320, CH = 400;
let cardBgC = null;
function cardBg() { if (cardBgC) return cardBgC; const c = document.createElement('canvas'); c.width = CW; c.height = CH; const x = c.getContext('2d'); const id = x.createImageData(CW, CH);
  ditherInto(id, CW, ['#fff8e6', '#fff1d8', '#ffe8de', '#ffdfe4'], 0, CH); x.putImageData(id, 0, 0); return cardBgC = c; }
function drawCard(c, f) {

  c.fillStyle = '#b3202f'; c.fillRect(0, 0, CW, 10); c.fillRect(0, CH - 10, CW, 10); c.fillRect(0, 0, 10, CH); c.fillRect(CW - 10, 0, 10, CH);
  c.fillStyle = '#d7263d'; c.fillRect(0, 0, CW, 2); c.fillRect(0, 0, 2, CH);
  c.fillStyle = gold; c.fillRect(14, 14, CW - 28, 2); c.fillRect(14, CH - 16, CW - 28, 2); c.fillRect(14, 14, 2, CH - 28); c.fillRect(CW - 16, 14, 2, CH - 28);
  c.fillStyle = '#ffe08a'; c.fillRect(18, 18, CW - 36, 1); c.fillRect(18, 18, 1, CH - 36);
  for (let i = 6, k = 0; i < CW - 6; i += 14, k++) { c.fillStyle = (k + f) % 2 ? '#ffd43b' : '#ff9eb0'; c.fillRect(i, 4, 3, 3); c.fillRect(CW - i - 3, CH - 7, 3, 3); }
  for (let j = 6, k = 0; j < CH - 6; j += 14, k++) { c.fillStyle = (k + f) % 2 ? '#ff9eb0' : '#ffd43b'; c.fillRect(4, j, 3, 3); c.fillRect(CW - 7, CH - j - 3, 3, 3); }
  [[22, 22], [CW - 35, 22], [22, CH - 34], [CW - 35, CH - 34]].forEach(([x, y]) => c.drawImage(S.heart, x, y));
  center(c, pixText('囍', 38, red), 14);
  const gT = fitText(CONFIG.groom, 112, 34, red), bT = fitText(CONFIG.bride, 112, 34, red);
  const tw = gT.width + bT.width + 38, nx = Math.round((CW - tw) / 2);
  c.drawImage(gT, nx, 58); c.drawImage(S.heart, nx + gT.width + 6, 72, 26, 24); c.drawImage(bT, nx + gT.width + 38, 58);

  c.fillStyle = '#51cf66'; c.fillRect(34, base, CW - 68, 3); c.fillStyle = '#2f9e44'; c.fillRect(34, base + 3, CW - 68, 1);
  for (let x = 38; x < CW - 38; x += 11) { c.fillStyle = (x >> 1) % 2 ? '#ff8fab' : '#ffd43b'; c.fillRect(x, base - 2, 3, 2); }
  const hop = f % 2 ? 3 : 0;

  center(c, pixText('tới dự lễ cưới tại ' + W8.label, 22, ink), y); y += 24;
  center(c, fitText(W8.time, CW - 56, 22, red), y); y += 25;
  let lines = wrapText(W8.address, CW - 56, 20, ink); if (lines.length > 2) lines = wrapText(W8.address, CW - 56, 18, ink);

  const hl = pixText('Hẹn gặp bạn ở tiệc cưới!', 20, '#7a5a66'), hx = Math.round((CW - hl.width - 16) / 2);

let cardTimer = 0;
async function openCard() {
  stopStory(true);
  try { await document.fonts.load('18px "VT323"', 'Trân trọng kính mời ễ ữ'); } catch (e) {}
  txtCache.clear();
  openModal(`<h2 style="text-align:center">Thiệp mời của ${esc(guest.name || 'bạn')}</h2>
    <canvas id="cardView" width="${CW}" height="${CH}"></canvas>
    <p class="status" id="st"></p>
    <div class="actions"><button type="button" class="btn wide" id="save">Lưu thiệp GIF</button><button type="button" class="btn alt wide" id="again">Xem lại</button></div>`);
  const cc = $('cardView').getContext('2d'); let f = 0;
  clearInterval(cardTimer); cardTimer = setInterval(() => { if (!$('cardView')) return clearInterval(cardTimer); drawCard(cc, f++ % 12); }, 120);
  drawCard(cc, 0);
  $('save').onclick = saveGif;
  $('again').onclick = () => { clearInterval(cardTimer); closeModal(); showMenu(); };
}

class BW { constructor() { this.a = new Uint8Array(1 << 20); this.n = 0; }
  b(v) { if (this.n >= this.a.length) { const t = new Uint8Array(this.a.length * 2); t.set(this.a); this.a = t; } this.a[this.n++] = v; }
  w16(v) { this.b(v & 255); this.b(v >> 8 & 255); } s(str) { for (let i = 0; i < str.length; i++) this.b(str.charCodeAt(i)); }
  out() { return this.a.slice(0, this.n); } }
function lzw(bw, idx, minSize) {
  bw.b(minSize);
  const clear = 1 << minSize, eoi = clear + 1; let next = eoi + 1, size = minSize + 1, cur = 0, shift = 0, bn = 0;
  const blk = new Uint8Array(255);
  const byte = v => { blk[bn++] = v; if (bn === 255) { bw.b(255); for (let i = 0; i < 255; i++) bw.b(blk[i]); bn = 0; } };
  const emit = code => { cur |= code << shift; shift += size; while (shift >= 8) { byte(cur & 255); cur >>>= 8; shift -= 8; } };
  let table = new Map(); emit(clear); let ib = idx[0];
  for (let i = 1; i < idx.length; i++) {
    const k = idx[i], key = (ib << 8) | k, c = table.get(key);
    if (c === undefined) { emit(ib); if (next === 4096) { emit(clear); next = eoi + 1; size = minSize + 1; table = new Map(); } else { if (next >= (1 << size)) size++; table.set(key, next++); } ib = k; }
    else ib = c;
  }
  emit(ib); emit(eoi); if (shift > 0) byte(cur & 255);

  bw.b(0);
}
function encodeGIF(w, h, pal, frames, delay) {
  let bits = 1; while ((1 << bits) < pal.length) bits++;
  const bw = new BW(); bw.s('GIF89a'); bw.w16(w); bw.w16(h); bw.b(0x80 | ((bits - 1) << 4) | (bits - 1)); bw.b(0); bw.b(0);
  for (let i = 0; i < (1 << bits); i++) { const c = pal[i] || [0, 0, 0]; bw.b(c[0]); bw.b(c[1]); bw.b(c[2]); }

}
async function buildGif(onProgress) {
  const N = 12, SC = 3, c = document.createElement('canvas'); c.width = CW; c.height = CH; const x = c.getContext('2d');
  const map = new Map(), pal = [], frames = [];
  const nearest = (r, g, b) => { let bi = 0, bd = 1e9; pal.forEach((p, i) => { const d = (p[0] - r) ** 2 + (p[1] - g) ** 2 + (p[2] - b) ** 2; if (d < bd) { bd = d; bi = i; } }); return bi; };
  for (let f = 0; f < N; f++) {
    drawCard(x, f); const d = x.getImageData(0, 0, CW, CH).data; const small = new Uint8Array(CW * CH);
    for (let i = 0, j = 0; i < d.length; i += 4, j++) { const key = d[i] << 16 | d[i + 1] << 8 | d[i + 2]; let ix = map.get(key);
      if (ix === undefined) { if (pal.length < 256) { ix = pal.length; pal.push([d[i], d[i + 1], d[i + 2]]); } else ix = nearest(d[i], d[i + 1], d[i + 2]); map.set(key, ix); } small[j] = ix; }

let downloadsNS = null;
if (window.claude && typeof window.claude.use === 'function') window.claude.use('downloads').then(d => { downloadsNS = d; }).catch(() => {});
async function saveGif() {
  const btn = $('save'), st = $('st'); btn.disabled = true;
  try {
    const bytes = await buildGif((i, n) => { st.textContent = `Đang tạo GIF… ${i}/${n}`; });
    const blob = new Blob([bytes], { type: 'image/gif' });
    const fname = `thiep-cuoi-${slug(CONFIG.groom)}-${slug(CONFIG.bride)}.gif`;
    if (downloadsNS) {
      try { await downloadsNS.save({ filename: fname, data: blob }); st.textContent = 'Đã lưu thiệp. Đăng lên mạng xã hội thôi!'; }
      catch (e) { if (e && e.code === 'declined') st.textContent = 'Bạn đã huỷ lưu. Bấm lại nếu muốn lưu.'; else showGifFallback(blob, st); }
    } else showGifFallback(blob, st);
  } catch (e) { st.textContent = 'Không tạo được GIF trên thiết bị này. Hãy chụp màn hình thiệp nhé.'; }
  btn.disabled = false;
}
function showGifFallback(blob, st) {
  const r = new FileReader();
  r.onload = () => { clearInterval(cardTimer); const img = document.createElement('img'); img.src = r.result; img.alt = 'Thiệp cưới dạng GIF'; img.id = 'cardView'; img.style.userSelect = 'auto'; img.style.webkitTouchCallout = 'default'; $('cardView').replaceWith(img);
    st.textContent = 'Nhấn giữ ảnh (điện thoại) hoặc chuột phải (máy tính) để lưu GIF.'; };

}
function slug(s) { return s.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'D').toLowerCase().replace(/[^a-z0-9]+/g, '-'); }

/* ================== ĐIỀU KHIỂN ================== */
addEventListener('keydown', e => {
  if (!modal.hidden) return;
  if (dlg && (e.code === 'Space' || e.code === 'Enter' || e.code === 'KeyZ')) { e.preventDefault(); if (!e.repeat) advance(); }
});
stage.addEventListener('pointerdown', e => { if (dlg && !e.target.closest('button')) { e.preventDefault(); advance(); } });
function layout() {
  const cs = getComputedStyle(document.documentElement);
  const ah = innerHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom) - 8;
  const w = Math.floor(Math.min(innerWidth - 8, ah * 16 / 9));
  stage.style.width = w + 'px'; stage.style.height = Math.floor(w * 9 / 16) + 'px';
  stage.style.fontSize = Math.max(12, Math.min(24, w / 40)) + 'px';
}
addEventListener('resize', layout);

/* ================== KHỞI ĐỘNG ================== */
buildSprites(); buildVariants(); layout(); showMenu(); requestAnimationFrame(loop);
if (document.fonts) document.fonts.load('16px "VT323"', 'Tin nhắn ễ ữ').then(() => txtCache.clear()).catch(() => {});
</script>
